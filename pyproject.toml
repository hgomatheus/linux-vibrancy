[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-vibrancy"
dynamic = ["version"]
description = "NVIDIA-style digital vibrance (colour saturation) control for Linux desktops"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
gui = ["PyQt6"]

[project.scripts]
vibrance = "vibrance.cli:main"

[tool.setuptools]
packages = ["vibrance"]

[tool.setuptools.dynamic]
version = { attr = "vibrance.__version__" }

[tool.pytest.ini_options]
# makepkg puts src/ and pkg/ (not readable mid-build) next to the sources.
testpaths = ["tests"]
